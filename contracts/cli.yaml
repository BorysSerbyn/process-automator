      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/schedule-build.schema.json
  - command: schedule describe
    usage: procauto schedule describe <cron>
    summary: Say what a schedule means and when it next runs
    example: procauto schedule describe '20 9 * * 1-5'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/schedule-describe.schema.json
  - command: settings get
    usage: procauto settings get <key>
    summary: Print one setting's value
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/settings-get.schema.json
  - command: settings list
    usage: procauto settings list [flags]
    summary: List every setting with its value, default and description
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
      - name: --routine
        type: string
        usage: only this routine's (or hook's) settings
      - name: --scope
        type: string
        default: all
        usage: all, app (app-wide settings), routines (each routine's) or hooks (each hook's and watcher's)
    jsonOutput: cli/settings-list.schema.json
  - command: settings reset
    usage: procauto settings reset <key>
    summary: Remove an override so the default applies
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/settings-reset.schema.json
  - command: settings set
    usage: procauto settings set <key> <value>
    summary: Change a setting (validated against its type and limits)
    example: |-
      procauto settings set llm.backend claude-code
      procauto settings set routines.standup.enabled false
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/settings-set.schema.json
  - command: setup
    usage: procauto setup [flags]
    summary: 'Guided first run: templates, the model backend, sign-ins, and turning routines on'
    flags:
      - name: --json
        type: bool
        usage: list the steps and the commands for each, changing nothing
    jsonOutput: cli/setup.schema.json
  - command: start
    usage: procauto start <routine> [flags]
    summary: 'Start a routine''s run (either kind) in the background and return at once (frontends: run now)'
    flags:
      - name: --dry-run
        type: bool
        usage: intercept every side-effecting tool call (nothing is posted or written); a program that writes gets --dry-run
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/start.schema.json
  - command: status
    usage: procauto status [flags]
    summary: 'Show the app''s status: health, why, and each routine''s last and next run'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
      - name: --watch
        type: bool
        usage: print it again, as one JSON line, each time it changes (until stopped)
    jsonOutput: cli/status.schema.json
  - command: stop
    usage: procauto stop <routine> [flags]
    summary: Stop a routine's run in progress (or waiting for its turn); it's recorded as stopped
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/stop.schema.json
  - command: templates install
    usage: procauto templates install <template> [flags]
    summary: 'Install a template: a routine, a program, a hook or a watcher; it starts off and untrusted'
    example: |-
      procauto templates install projects/acme/standup
      procauto templates install personal/digest --set lookback=72h
    flags:
      - name: --as
        type: string
        usage: 'routine name (default: the template''s name)'
      - name: --json
        type: bool
        usage: machine-readable output
      - name: --set
        type: stringArray
        usage: a parameter value, param=value (repeatable)
    jsonOutput: cli/templates-install.schema.json
  - command: templates list
    usage: procauto templates list [flags]
    summary: List templates for this OS (--all for every OS); a hook comes with its watcher, as one
    flags:
      - name: --all
        type: bool
        usage: include templates for other operating systems
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/templates-list.schema.json
  - command: templates outdated
    usage: procauto templates outdated [flags]
    summary: 'List what I installed from a template that has changed since (--all: changes I didn''t take too)'
    flags:
      - name: --all
        type: bool
        usage: include changes I chose not to take
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/templates-outdated.schema.json
  - command: templates override
    usage: procauto templates override [<name>...] [flags]
    summary: Replace what I installed from a template with its new version (`templates outdated` lists them)
    flags:
      - name: --all
        type: bool
        usage: override every one offered
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/templates-override.schema.json
  - command: templates skip
    usage: procauto templates skip [<name>...] [flags]
    summary: 'Leave what I installed from a template as it is: its template''s change isn''t offered again, a later one is'
    flags:
      - name: --all
        type: bool
        usage: every one offered
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/templates-skip.schema.json
  - command: uninstall
    usage: procauto uninstall [flags]
    summary: Remove the app, its CLI link and its login items; --purge also your config, routines, history, logs and secrets
    flags:
      - name: --purge
        type: bool
        usage: also remove config, routines, history, logs and secrets
      - name: --yes
        type: bool
        usage: don't ask (needed without a terminal)
  - command: update
    usage: procauto update [flags]
    summary: Install the latest release; --check only reports
    flags:
      - name: --ask
        type: bool
        usage: say what's available and ask in the terminal before installing it (frontends that can't ask themselves)
      - name: --check
        type: bool
        usage: only report whether a newer release exists
      - name: --detach
        type: bool
        usage: install in the background and return at once; the result comes as a notification (frontends)
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/update.schema.json
  - command: update notes
    usage: procauto update notes [<release>] [flags]
    summary: Show a release's notes (this version's by default)
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/update-notes.schema.json
  - command: update progress
    usage: procauto update progress [flags]
    summary: Show what the update installing is doing, or how the latest one ended
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/update-progress.schema.json
  - command: update status
    usage: procauto update status [flags]
    summary: 'Show where updates stand: this version, the latest release, and automatic updates'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/update-status.schema.json
  - command: usage
    usage: procauto usage [flags]
    summary: 'LLM usage against its limit: the Claude plan''s usage (claude-code) or API spend (claude-api); none on codex'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/usage.schema.json
  - command: usage statusline
    usage: procauto usage statusline
    summary: 'Claude Code runs this as its status line: it records the plan''s usage, then runs yours'
  - command: usage statusline install
    usage: procauto usage statusline install [flags]
    summary: Have Claude Code's status line record the plan's usage (yours keeps showing)
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/usage-statusline-install.schema.json
  - command: usage statusline uninstall
    usage: procauto usage statusline uninstall [flags]
    summary: Put back the Claude Code status line you had
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/usage-statusline-uninstall.schema.json
  - command: version
    usage: procauto version [flags]
    summary: Print the version
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/version.schema.json
  - command: watchers add
    usage: procauto watchers add <watcher> [flags]
    summary: Add a watcher from its watcher.yaml (its executable beside it); it runs once trusted
    example: procauto watchers add calendar --from ./calendar/watcher.yaml
    flags:
      - name: --from
        type: string
        usage: the watcher's description file, with its executable beside it
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-add.schema.json
  - command: watchers delete
    usage: procauto watchers delete <watcher> [flags]
    summary: 'Delete a watcher: its copy, settings, trust, secrets and state (the hooks listening to it stay)'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-delete.schema.json
  - command: watchers list
    usage: procauto watchers list [flags]
    summary: 'List watchers: their mode, trust, the hooks listening and how they last went'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-list.schema.json
  - command: watchers pause
    usage: procauto watchers pause <watcher> [flags]
    summary: 'Stop a watcher: its process ends, and it isn''t run until resumed'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-pause.schema.json
  - command: watchers resume
    usage: procauto watchers resume <watcher> [flags]
    summary: Let a paused watcher run again
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-resume.schema.json
  - command: watchers show
    usage: procauto watchers show <watcher> [flags]
    summary: 'Show a watcher: its description file, trust, the hooks listening and how it last went'
    flags:
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-show.schema.json
  - command: watchers trust
    usage: procauto watchers trust <watcher> [flags]
    summary: Review a watcher's executable and secrets, and trust it to run
    flags:
      - name: --check
        type: bool
        usage: only show what it runs and what changed; trust nothing
      - name: --json
        type: bool
        usage: machine-readable output
      - name: --yes
        type: bool
        usage: don't ask (after reviewing it)
    jsonOutput: cli/watchers-trust.schema.json
  - command: watchers update
    usage: procauto watchers update <watcher> [flags]
    summary: Replace a watcher's copy from its watcher.yaml; a changed one needs trusting again
    example: procauto watchers add calendar --from ./calendar/watcher.yaml
    flags:
      - name: --from
        type: string
        usage: the watcher's description file, with its executable beside it
      - name: --json
        type: bool
        usage: machine-readable output
    jsonOutput: cli/watchers-update.schema.json
