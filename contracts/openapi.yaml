    RunStatus:
      additionalProperties: false
      description: Status is the whole record.
      properties:
        busy:
          description: |-
            Busy is true while a routine is running (not counting runs stuck past
            MaxRunDuration); frontends show activity from it.
          type: boolean
        health:
          enum:
            - ok
            - error
            - none
          type: string
        problem:
          description: |-
            Problem says why the scheduler can't work right now (e.g. the config
            file doesn't load); set and cleared by the scheduler on every check.
          type: string
        reasons:
          description: |-
            Reasons say why health is error, in words, for frontends to show as
            they are; empty when it isn't. They come from the same rules as health.
          items:
            $ref: '#/components/schemas/RunStatusReason'
          type: array
        routines:
          items:
            $ref: '#/components/schemas/RunStatusRoutine'
          type: array
        schemaVersion:
          type: integer
        setupLeft:
          description: |-
            SetupLeft names the setup steps still to do (`setup --json`'s titles;
            empty when setup is done). Unfinished setup makes health error.
          items:
            type: string
          type: array
        summary:
          description: |-
            Summary is the state in a few words ("All good", "No routines
            enabled"), for frontends to show when there are no reasons.
          type: string
        updatedAt:
          format: date-time
          type: string
        validUntil:
          description: |-
            ValidUntil is the scheduler's heartbeat: the status holds until then.
            Past it (or absent), the core isn't responding.
          format: date-time
          type: string
      required:
        - schemaVersion
        - updatedAt
        - health
        - busy
        - routines
      type: object
    RunStatusReason:
      additionalProperties: false
      description: Reason is one thing making health error.
      properties:
        detail:
          type: string
        routine:
          description: Routine it's about; empty for the scheduler itself.
          type: string
        run:
          description: Run is the run it's about (a history ID, as `runs show` takes), if any.
          type: string
        text:
          description: |-
            Text is a short headline ("standup failed"); Detail the full story (the
            run's reason), for frontends to show on demand.
          type: string
      required:
        - text
      type: object
    RunStatusRoutine:
      additionalProperties: false
      description: Routine is one routine's entry.
      properties:
        enabled:
          type: boolean
        health:
          description: |-
            Health is the routine's own verdict: error when it makes the app's
            health error, ok while it's enabled and fine, none while it's paused.
          type: string
        lastRun:
          $ref: '#/components/schemas/RunStatusRun'
        name:
          type: string
        nextRunAt:
          description: |-
            NextRunAt is the next slot the scheduler will handle (enabled, scheduled
            routines only). The scheduler moves it forward as soon as it picks a slot
            up, so one more than SchedulerGrace in the past means it didn't.
          format: date-time
          type: string
        problem:
          description: |-
            Problem says why the routine can't be scheduled (e.g. its file doesn't
            parse). It's current state, cleared as soon as the routine is fixed.
          type: string
        summary:
          description: |-
            Summary is its state in a few words ("Next: tomorrow 09:20", "standup
            failed", "Paused"), for frontends to show as is.
          type: string
      required:
        - name
        - enabled
      type: object
    RunStatusRun:
      additionalProperties: false
      description: Run is the most recent run of a routine.
      properties:
        backend:
          description: |-
            Backend is the model backend running it, or that ran it (llm.backend's
            value), once it got as far as the model.
          type: string
        deadline:
          description: Deadline is when a running run is stopped (its routine's timeout).
          format: date-time
          type: string
        finishedAt:
          format: date-time
          type: string
        folder:
          description: |-
            Folder is the folder the run worked in (where its session resumes
            from), unless it was an empty temporary one.
          type: string
        for:
          description: For is the time the run is for (the schedule slot, the backfilled day).
          format: date-time
          type: string
        id:
          description: ID is the run's history ID (as `runs show` takes).
          type: string
        outcome:
          enum:
            - success
            - failed
            - skipped
            - missed
            - needs-reauth
            - running
            - queued
            - stopped
          type: string
        queuedAt:
          description: QueuedAt is when the run started waiting for its turn, if it had to.
          format: date-time
          type: string
        reason:
          type: string
        sessionId:
          description: |-
            SessionID is the run's saved agent CLI session (routines with
            session: save): set when the run starts if the app picks its ID, when
            it ends if the CLI does (Backend says which CLI resumes it).
          type: string
        startedAt:
          format: date-time
          type: string
        trigger:
          description: |-
            Trigger is what started the run: "schedule", "manual" or "backfill"
            (empty in records from before triggers were recorded).
          type: string
      required:
        - startedAt
        - outcome
      type: object
    SetupOutput:
      additionalProperties: false
      description: 'SetupOutput is `setup --json`: every step, in order of kind (templates, backend, plan usage, Claude Code''s MCP connection, routines to fix, sign-ins, routines to turn on).'
      properties:
        done:
          description: |-
            Done is true when every step that isn't optional is; Remaining counts
            those that aren't.
          type: boolean
        remaining:
          type: integer
        steps:
          items:
            $ref: '#/components/schemas/SetupStep'
          type: array
      required:
        - steps
        - done
        - remaining
      type: object
    SetupStep:
      additionalProperties: false
      description: SetupStep is one thing first-run setup covers.
      properties:
        ask:
          type: string
        auto:
          description: |-
            Auto steps are done without asking: the interactive setup and
            frontends run its commands as soon as they come to it (connecting
            Claude Code to the app's MCP server). Ask is empty.
          type: boolean
        commands:
          description: |-
            Commands do the step once I've answered: placeholders in <angle
            brackets> are my answers, and a trailing # comment says when a command
            applies or what to do with its output.
          items:
            type: string
          type: array
        done:
          type: boolean
        optional:
          description: |-
            Optional steps don't keep setup from being done: installing templates,
            and resuming a trusted routine once another routine already runs on its
            schedule (a paused one may be paused on purpose).
          type: boolean
        prepare:
          description: |-
            Prepare is what to do outside the app before signing in (a sign-in
            step whose plugin needs it, e.g. creating a Slack app): numbered steps
            to show, and have done, first. `auth login` shows them too.
          type: string
        setting:
          description: |-
            Setting is the setting the step chooses, for frontends to show and set
            (backend: llm.backend).
          type: string
        signIn:
          description: |-
            SignIn is what the step still needs signed in (`auth login <signIn>
            --browser`): a server, or the API key the api backend needs.
          type: string
        status:
          description: |-
            Status says where it stands, and Ask what to ask me before doing it, in
            words for me.
          type: string
        step:
          description: Step is what it sets up.
          enum:
            - templates
            - backend
            - routine
            - sign-in
            - turn-on
            - usage
            - mcp
          type: string
        subject:
          description: Subject is the server or routine it's about (routine, sign-in, turn-on).
          type: string
        title:
          description: Title names the step ("Model backend", "Sign in to tracker").
          type: string
      required:
        - step
        - title
        - done
        - status
      type: object
    StartOutput:
      additionalProperties: false
      description: 'StartOutput is `start --json`: a run started in the background.'
      properties:
        dryRun:
          type: boolean
        log:
          description: |-
            Log is where the run's output goes; its outcome is in run status and
            the run history, as for any run.
          type: string
        routine:
          type: string
      required:
        - routine
        - dryRun
        - log
      type: object
    State:
      additionalProperties: false
      description: State is a setting with its effective value.
      properties:
        backend:
          description: 'Backend is the llm.backend it applies to; empty: every backend.'
          type: string
        default: {}
        defaultText:
          type: string
        description:
          type: string
        enum:
          items:
            type: string
          type: array
        inactive:
          description: |-
            Inactive says why the setting has no effect now: it's for another
            llm.backend than the one in use.
          type: string
        isDefault:
          type: boolean
        key:
          type: string
        max:
          type: number
        min:
          type: number
        notImplemented:
          description: |-
            NotImplemented marks a setting declared ahead of the feature that uses it:
            it can be set, but has no effect yet.
          type: boolean
        type:
          enum:
            - bool
            - int
            - number
            - percent
            - duration
            - cron
            - enum
            - string
            - path
            - list
          type: string
        unit:
          type: string
        value: {}
        valueText:
          description: |-
            ValueText and DefaultText are the values written the way `settings set`
            takes them ("" when unset), for frontends to show and send back as is.
          type: string
      required:
        - key
        - type
        - default
        - description
        - value
        - isDefault
        - valueText
        - defaultText
      type: object
    StatusLineOutput:
      additionalProperties: false
      description: StatusLineOutput is `usage statusline install|uninstall --json`.
      properties:
        installed:
          description: Installed is whether Claude Code's status line runs the app's command.
          type: boolean
        wraps:
          description: 'Wraps is the status line command of mine the app runs (empty: none).'
          type: string
      required:
        - installed
      type: object
    StopOutput:
      additionalProperties: false
      description: 'StopOutput is `stop --json`: how the stopped run ended.'
      properties:
        outcome:
          type: string
        reason:
          type: string
        routine:
          type: string
      required:
        - routine
        - outcome
      type: object
    Summary:
      additionalProperties: false
      description: Summary is an entry without the agent result, for listings.
      properties:
        backend:
          description: Backend is what ran it (an llm.backend value), when it got as far as the model.
          type: string
        costUsd:
          description: |-
            CostUSD is the run's cost at API list prices: api runs only (a Claude
            plan's runs have no cost).
          type: number
        finishedAt:
          format: date-time
          type: string
        folder:
          type: string
        for:
          format: date-time
          type: string
        id:
          type: string
        outcome:
          type: string
        reason:
          type: string
        routine:
          type: string
        sessionId:
          type: string
        startedAt:
          format: date-time
          type: string
        toolCalls:
          type: integer
        trigger:
          type: string
      required:
        - id
        - routine
        - trigger
        - startedAt
        - outcome
      type: object
    Surface:
      additionalProperties: false
      description: Surface is what a routine can reach.
      properties:
        builtinTools:
          items:
            type: string
          type: array
        folder:
          type: string
        plugins:
          type: object
        servers:
          items:
            type: string
          type: array
        tools:
          items:
            type: string
          type: array
      required:
        - servers
        - tools
      type: object
    TemplateInfo:
      additionalProperties: false
      description: TemplateInfo is one row of `templates list --json`.
      properties:
        backends:
          description: 'Backends it works with (llm.backend values); none: any.'
          items:
            type: string
          type: array
        description:
          type: string
        id:
          description: ID is its tag path and name, e.g. "projects/acme/standup".
          type: string
        installed:
          description: Installed is true when a routine with the template's name exists.
          type: boolean
        name:
          type: string
        params:
          items:
            $ref: '#/components/schemas/Param'
          type: array
        platforms:
          items:
            type: string
          type: array
        project:
          description: |-
            Project is the project it's for (its folder under projects/, e.g.
            "acme"); empty for every project or none.
          type: string
        runsHere:
          description: RunsHere is false for templates for another OS (listed with --all).
          type: boolean
        supportsBackend:
          description: |-
            SupportsBackend is false for a template that doesn't work with the
            selected backend (llm.backend): installing it is refused.
          type: boolean
        tags:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - tags
        - runsHere
        - supportsBackend
        - installed
      type: object
    ToolInfo:
      additionalProperties: false
      description: ToolInfo is one row of `mcp tools --json`.
      properties:
        description:
          type: string
        inputSchema: {}
        name:
          type: string
        readOnly:
          description: ReadOnly is the server's readOnlyHint annotation (nil when not declared).
          type: boolean
      required:
        - name
        - description
      type: object
    TrustOutput:
      additionalProperties: false
      description: TrustOutput is `routines trust --json`.
      properties:
        changes:
          description: Changes since it was last trusted (empty for a first trust).
          items:
            type: string
          type: array
        resumed:
          description: Resumed is true when --resume turned its schedule on (it was paused).
          type: boolean
        routine:
          type: string
        surface:
          $ref: '#/components/schemas/Surface'
        tools:
          description: |-
            Tools are its allowlisted tools with the server offering each and
            whether it's read-only (absent when its servers couldn't be reached).
          items:
            $ref: '#/components/schemas/CheckedTool'
          type: array
        toolsError:
          description: |-
            ToolsError says why its tools couldn't be checked (e.g. a server needs
            a sign-in).
          type: string
        trusted:
          type: boolean
      required:
        - routine
        - surface
        - changes
        - trusted
      type: object
    UpdateOutput:
      additionalProperties: false
      description: UpdateOutput is `update --json`.
      properties:
        current:
          type: string
        inProgress:
          description: |-
            InProgress is true while an update is installing (this one, or one
            started before).
          type: boolean
        latest:
          description: Latest is the newest release tag, empty when there are none.
          type: string
        note:
          description: |-
            Note says what installing involves, for frontends to show before they
            start one (set when an update is available).
          type: string
        started:
          description: Started is true when --detach started the update in the background.
          type: boolean
        updateAvailable:
          type: boolean
        updated:
          type: boolean
      required:
        - current
        - latest
        - updateAvailable
        - updated
        - inProgress
      type: object
    UpdateProgress:
      additionalProperties: false
      description: 'UpdateProgress is `update progress --json`: the latest update, as it goes.'
      properties:
        detail:
          description: Detail is the latest line of the step's output (a build's), if any.
          type: string
        error:
          description: Error is why it failed.
          type: string
        finishedAt:
          format: date-time
          type: string
        log:
          description: Log is the file a detached update writes its whole output to.
          type: string
        startedAt:
          format: date-time
          type: string
        state:
          description: State is none (no update has run), installing, done or failed.
          enum:
            - none
            - installing
            - done
            - failed
          type: string
        step:
          description: Step is what it's doing (or last did), in words.
          type: string
        tag:
          description: Tag is the release being installed, once known.
          type: string
      required:
        - state
        - log
      type: object
    VersionOutput:
      additionalProperties: false
      description: VersionOutput is `version --json`.
      properties:
        version:
          type: string
      required:
        - version
      type: object
    Window:
      additionalProperties: false
      description: Window is usage in one window.
      properties:
        budgetUsd:
          type: number
        length:
          description: Length is the window's length ("5h", "7d").
          type: string
        name:
          description: Name is "session" or "weekly" (plan), "window" or "week" (budget).
          type: string
        over:
          type: boolean
        resetsAt:
          format: date-time
          type: string
        spentUsd:
          description: |-
            SpentUSD is what runs spent in it, and BudgetUSD its budget (budget;
            a budget of 0 is none).
          type: number
        usedPercent:
          description: |-
            UsedPercent is how much of the plan's limit is used, and ResetsAt when
            it resets (plan; absent: not known).
          type: number
      required:
        - name
        - length
        - over
      type: object
    Write:
      additionalProperties: false
      description: Write is a side-effecting tool call (intercepted in dry-run).
      properties:
        args:
          type: object
        error:
          description: Error is the tool's error, when the call failed.
          type: string
        tool:
          type: string
      required:
        - tool
        - args
      type: object
info:
  title: procauto frontend types
  version: "1"
openapi: 3.1.0
paths: {}
