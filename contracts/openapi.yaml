          items:
            type: string
          type: array
      required:
        - name
        - kind
      type: object
    PluginTool:
      additionalProperties: false
      description: PluginTool is one of a plugin's tools, as a routine would see it.
      properties:
        annotated:
          description: Annotated is whether the tool declares annotations (readOnlyHint) at all.
          type: boolean
        name:
          type: string
        readOnly:
          description: ReadOnly tools run in dry runs; the others are writes (intercepted).
          type: boolean
      required:
        - name
