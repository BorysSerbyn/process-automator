          type: boolean
        hook:
          type: string
        kind:
          description: Kind is program for a program hook; absent for an LLM hook (llm).
          enum:
            - llm
            - program
          type: string
        path:
          type: string
      required:
        - hook
        - path
      type: object
    HookDetail:
      additionalProperties: false
      description: 'HookDetail is `hooks show --json`: a hook with its file''s source and its watcher.'
      properties:
        batch:
