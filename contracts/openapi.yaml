          type: string
        usedPercent:
          type: number
      required:
        - model
        - usedPercent
        - resetsAt
      type: object
    Notification:
      additionalProperties: false
      description: Notification is one thing to tell me.
      properties:
        at:
          format: date-time
          type: string
        body:
          type: string
        deliveredAt:
          description: DeliveredAt is when a frontend showed it; absent until then.
