          items:
            type: string
          type: array
        source:
          description: Source is its file as written.
          type: string
        staleness:
          type: string
        timeout:
          type: string
        tools:
          items:
            type: string
          type: array
        trusted:
          description: |-
            Trusted is whether it may run for real (what it reaches and acts on
