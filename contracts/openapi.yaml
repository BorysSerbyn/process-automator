          items:
            $ref: '#/components/schemas/Notification'
          type: array
        schemaVersion:
          type: integer
      required:
        - schemaVersion
        - notifications
      type: object
    "On":
      additionalProperties: false
      description: 'On is what a hook listens for: a watcher''s events, of one type or (no type) every type.'
      properties:
        label:
          description: |-
            Label is what its type means, as its watcher declares it ("End key
            pressed"): set by the app from the watcher, never written in a hook's
            file. Absent when it has no type, or its watcher declares none.
          type: string
        type:
          type: string
        watcher:
          type: string
      required:
        - watcher
      type: object
    Param:
      additionalProperties: false
      description: Param is one routine parameter.
      properties:
        default: {}
        defaultText:
