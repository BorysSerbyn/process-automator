        description:
          type: string
        enum:
          items:
            type: string
          type: array
        name:
          type: string
        required:
          description: |-
            Required is true for a parameter without a default; DefaultText is the
            default written as `templates install --set` takes it. Both are worked
            out when the routine is parsed.
          type: boolean
        type:
          type: string
      required:
        - name
        - type
        - required
      type: object
    PathsOutput:
      additionalProperties: false
      description: 'PathsOutput is `paths --json`: where the app keeps its files.'
      properties:
        config:
          type: string
        data:
          type: string
        frontendLog:
          description: |-
            FrontendLog is the log a frontend keeps there, if it keeps one: the
