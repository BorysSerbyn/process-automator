          type: string
        lastRun:
          $ref: '#/components/schemas/RunStatusRun'
          description: LastRun is its latest outcome from run status.
        model:
          type: string
        name:
          type: string
        "on":
          $ref: '#/components/schemas/On'
          description: |-
            On is what it acts on: a watcher's events, of one type (or every
            type), with the type's label as its watcher declares it.
        path:
          description: |-
            Path is its file: its prompt, or its program's description file (in
