        effort:
          description: |-
            Effort is the routine's effort setting ("default" leaves it to the
            backend); empty for a program.
          type: string
        enabled:
          type: boolean
        folder:
          description: |-
            Folder is where its runs work (absent: a temporary folder; a
            program's data folder); frontends can filter routines by it.
          type: string
        kind:
          description: Kind is program for a program; absent for an LLM routine (llm).
          enum:
            - llm
            - program
          type: string
        lastRun:
          $ref: '#/components/schemas/RunStatusRun'
          description: LastRun is the latest outcome from run status.
