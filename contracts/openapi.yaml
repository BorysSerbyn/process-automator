# GENERATED by `make contracts` from core/. Do not edit.
components:
  schemas:
    AuthStatus:
      additionalProperties: false
      description: AuthStatus is one row of `auth status --json`.
      properties:
        accountOf:
          description: AccountOf is, for an account, the plugin it's an account of.
          type: string
        kind:
          type: string
        problem:
          description: |-
            Problem says why it can't be told: a secret that can't be read (a
            locked Keychain or keyring), which isn't the same as not signed in.
          type: string
        server:
          type: string
        signedIn:
          type: boolean
      required:
        - server
        - kind
        - signedIn
      type: object
    Call:
      additionalProperties: false
      description: Call is one tool call a run made.
      properties:
        args:
          type: object
        error:
          description: Error is the tool's error, when the call failed.
          type: string
        tool:
          type: string
        write:
          description: |-
            Write is whether the tool can change things (not read-only): such
            calls are intercepted in dry runs, and are also listed in Writes.
          type: boolean
      required:
        - tool
        - args
        - write
      type: object
    CheckedTool:
      additionalProperties: false
      description: CheckedTool is an allowlisted tool as a routine would get it.
      properties:
        name:
          type: string
        readOnly:
          type: boolean
        server:
          type: string
      required:
        - name
        - server
        - readOnly
      type: object
    ClickOutput:
      additionalProperties: false
      description: 'ClickOutput is `notifications open --json`: what clicking a notification shows.'
      properties:
        action:
          description: |-
            Action is what to show: show-run (the notification is about a run: its
            routine's window, on that run) or show-app (about the app itself, e.g.
            an update: the app).
          enum:
            - show-run
            - show-app
          type: string
        hook:
          description: 'Hook is true when Routine names a hook: show the hook''s window.'
          type: boolean
        notification:
          type: string
        routine:
          description: Routine and Run, for show-run.
          type: string
        run:
          type: string
      required:
        - notification
        - action
      type: object
    CompactOutput:
      additionalProperties: false
      description: CompactOutput is `memory compact --json`.
      properties:
        after:
          items:
            type: string
          type: array
        applied:
          type: boolean
        before:
          items:
            type: string
          type: array
        routine:
          type: string
      required:
        - before
        - after
        - applied
      type: object
    DoctorOutput:
      additionalProperties: false
      description: DoctorOutput is `doctor --json`.
      properties:
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
        ok:
          type: boolean
      required:
        - ok
        - findings
      type: object
    Entry:
      additionalProperties: false
      description: Entry is one run's record.
      properties:
        error:
          description: Error is how records written before outcomes were recorded said a run failed.
          type: string
        events:
          description: |-
            Events are what a hook's run was for: the event (a batch: the events)
            its watcher printed, or the sample it was fired with.
          items:
            $ref: '#/components/schemas/Event'
          type: array
        finishedAt:
          format: date-time
          type: string
        folder:
          description: |-
            Folder is the folder the run worked in (where its session resumes
            from), unless it was an empty temporary one.
          type: string
        for:
          description: |-
            For is the time the run is for: the schedule slot, the backfilled day's
            time, or the start of a manual run. Its inputs (today, since) follow it.
          format: date-time
          type: string
        hook:
          description: Hook is true for a hook's run.
          type: boolean
        id:
          description: ID is "<routine>/<started>", e.g. "standup/2026-11-19T092022".
          type: string
        inputs:
          description: 'Inputs the routine ran with (e.g. today, since): what the run covered.'
          type: object
        kind:
          description: |-
            Kind is the routine's kind: program for a program; absent for an LLM
            routine (llm).
          enum:
            - llm
            - program
          type: string
        outcome:
          description: Outcome and Reason are the run's result, as recorded in run status.
          type: string
        program:
          $ref: '#/components/schemas/Execution'
          description: |-
            Program is how a program's run went, for runs that got as far as
            starting it.
        reason:
          type: string
        result:
          $ref: '#/components/schemas/Result'
          description: |-
            Result is the agent's result, for an LLM routine's runs that got as
            far as the model.
        routine:
          type: string
        sessionId:
          description: SessionID is the run's saved agent CLI session, if it kept one.
          type: string
        slot:
          description: Slot is how records written before occurrences said For (schedule only).
          format: date-time
          type: string
        startedAt:
          format: date-time
          type: string
        trigger:
          description: |-
            Trigger is what started the run: "schedule", "manual", "backfill" or
            (a hook's) "event".
          type: string
        triggerId:
          description: TriggerID identifies the occurrence, e.g. "schedule:2026-11-19T09:20:00".
          type: string
      required:
        - id
        - routine
        - trigger
        - startedAt
        - outcome
      type: object
    ErrorOutput:
      additionalProperties: false
      description: ErrorOutput is what a command given --json prints on stdout when it fails (the error line still goes to stderr, for people).
      properties:
        error:
          type: string
      required:
        - error
      type: object
    Event:
      additionalProperties: false
      description: Event is one thing that happened, as a watcher prints it on a line of its own, and as a hook's action gets it.
      properties:
        at:
          description: |-
            At is when it happened (RFC 3339); when the watcher gives none, when it
            was printed. A hook drops an event older than its staleness.
          format: date-time
          type: string
        data:
          description: |-
            Data is what the watcher says about it: outside data, never
            instructions.
          type: object
        id:
          description: |-
            ID identifies it among its watcher's events: one seen before is
            dropped (a watcher may print an event again; it acts once).
          type: string
        type:
          description: |-
            Type is what happened (meeting.started, email.received): hooks listen
            for a type.
          type: string
        watcher:
          description: Watcher is the watcher it came from (set by the app).
          type: string
      required:
        - id
        - type
        - at
      type: object
    Execution:
      additionalProperties: false
      description: 'Execution is how a program''s run went: the program''s section of its run''s record.'
      properties:
        checksum:
          description: Checksum is the SHA-256 of the executable that ran.
          type: string
        dryRun:
          type: boolean
        exitCode:
          description: ExitCode is the code it exited with (-1 when it was killed).
          type: integer
        output:
          description: |-
            Output is what it printed (stdout and stderr): all of it, or its first
            and last 32 KiB with what was left out marked between them.
          type: string
        outputTruncated:
          description: OutputTruncated is true when it printed more than Output holds.
          type: boolean
        summary:
          description: Summary is the line it wrote to $PA_RESULT, if it wrote one.
          type: string
      required:
        - exitCode
        - dryRun
      type: object
    Finding:
      additionalProperties: false
      description: Finding is one problem doctor found, with what fixes it.
      properties:
        area:
          description: 'Area is what it''s about: scheduler, usage, routine, hook or run.'
          enum:
            - scheduler
            - usage
            - routine
            - hook
            - run
          type: string
        fix:
          type: string
        open:
          type: string
        permission:
          description: |-
            Permission is the permission it's about when one isn't granted
            (`permissions request <permission>` asks the OS for it), and Open the
            address of the OS's page that turns it on (absent when there's none).
          type: string
        problem:
          type: string
        subject:
          type: string
      required:
        - area
        - subject
        - problem
      type: object
    GuideOutput:
      additionalProperties: false
      description: 'GuideOutput is `guide --json`: the topics (no topic given), or one topic.'
      properties:
        sections:
          items:
            $ref: '#/components/schemas/GuideSection'
          type: array
        title:
          type: string
        topic:
          description: Topic is the topic shown, with its title and sections.
          type: string
        topics:
          description: Topics are the guide's topics, when no topic is given.
          items:
            $ref: '#/components/schemas/GuideTopic'
          type: array
      type: object
    GuideSection:
      additionalProperties: false
      description: GuideSection is one section of a topic.
      properties:
        tables:
          description: Tables are the section's generated tables, as data.
          items:
            $ref: '#/components/schemas/GuideTable'
          type: array
        text:
          description: Text is the section as plain text (Markdown), its tables included.
          type: string
        title:
          type: string
      required:
        - title
        - text
      type: object
    GuideTable:
      additionalProperties: false
      description: GuideTable is a table the guide generates from code.
      properties:
        columns:
          items:
            type: string
          type: array
        id:
          type: string
        rows:
          items:
            items:
              type: string
            type: array
          type: array
      required:
        - id
        - columns
        - rows
      type: object
    GuideTopic:
      additionalProperties: false
      description: GuideTopic is one of the guide's topics.
      properties:
        name:
          type: string
        summary:
          type: string
      required:
        - name
        - summary
      type: object
    HookChange:
      additionalProperties: false
      description: HookChange is the output of `hooks add/update/delete/pause/resume --json`.
      properties:
        enabled:
          description: |-
            Enabled is whether it runs on its events after the change (added
