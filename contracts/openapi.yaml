        - path
        - "on"
        - enabled
        - staleness
        - timeout
        - rate
        - trusted
        - source
      type: object
    HookInfo:
      additionalProperties: false
      description: 'HookInfo is one row of `hooks list --json`: a hook with its effective settings and last run.'
      properties:
        batch:
          description: Batch (an LLM hook's) gives one run every event that waited for it.
