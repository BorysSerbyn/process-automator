          format: date-time
          type: string
        kind:
          description: |-
            Kind is "plan" (claude-code: the Claude plan's usage against
            llm.usage-limit), "budget" (claude-api: spend against llm.budget.*) or "none"
            (a backend with no usage limit in the app, e.g. codex: no windows, never over).
          enum:
            - plan
            - budget
            - none
          type: string
        limitPercent:
          description: LimitPercent is llm.usage-limit (plan).
          type: number
        models:
          description: Models are single models' weekly limits (plan; shown, not applied).
          items:
            $ref: '#/components/schemas/ModelUsage'
          type: array
        over:
          description: Over is true when either window is past its limit; Reason says which.
          type: boolean
        readError:
          type: string
        reason:
          type: string
        recordedAt:
          description: |-
            RecordedAt is when Claude Code's status line last recorded the plan's
            usage (plan; the fallback while /usage can't be read).
          format: date-time
          type: string
        windows:
          items:
            $ref: '#/components/schemas/Window'
          type: array
      required:
        - kind
