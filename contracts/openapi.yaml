          type: array
        warnings:
          items:
            type: string
          type: array
      type: object
    ProgramInfo:
      additionalProperties: false
      description: 'ProgramInfo is a program''s section of its routine row: the copy of its executable the app runs, and what its description file declares.'
      properties:
        args:
          items:
            type: string
          type: array
        checksum:
          description: Checksum is the executable's SHA-256 (trust is keyed to it).
