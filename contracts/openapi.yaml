          type: array
        problem:
          description: |-
            Problem is why it can't run while it's on (its watcher missing,
            untrusted or failing, ...); empty when it can.
          type: string
        program:
          $ref: '#/components/schemas/ProgramInfo'
          description: 'Program is a program hook''s own: what runs and with what.'
        rate:
          description: Rate is how many runs it may start in any hour.
          type: integer
        servers:
          description: |-
            Servers, Tools, BuiltinTools and Model are an LLM hook's, as an LLM
