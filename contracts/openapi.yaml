    Info:
      additionalProperties: false
      description: Info is a schedule as frontends show it.
      properties:
        cron:
          type: string
        next:
          description: Next are the next few times it runs.
          items:
            format: date-time
            type: string
          type: array
        picker:
          $ref: '#/components/schemas/Picker'
          description: |-
            Picker is the schedule as days and a time, when it is one (nil: only
            cron can express it).
        text:
          description: Text is the schedule in plain words ("At 09:20, Monday through Friday").
          type: string
      required:
        - cron
        - text
        - next
      type: object
    InstallOutput:
      additionalProperties: false
      description: InstallOutput is `templates install --json`.
      properties:
        path:
          type: string
        routine:
          type: string
        template:
          type: string
      required:
        - template
        - routine
        - path
      type: object
