        permissions:
          description: |-
            Permissions are what the OS must allow it before it can work: its plugins' for an
            LLM routine, its own for a program (what declares each, and what the scheduler last found); absent when none.
          items:
            $ref: '#/components/schemas/PermissionNeed'
          type: array
        program:
          $ref: '#/components/schemas/ProgramInfo'
          description: 'Program is a program''s own: what runs and with what.'
        schedule:
          description: Schedule is the cron schedule; absent for routines run only by hand.
          type: string
        scheduleText:
          description: ScheduleText is the schedule in plain words ("At 09:20, Monday through Friday").
          type: string
        servers:
          items:
            type: string
          type: array
        session:
          description: |-
            Session is "save" when runs keep their agent CLI session, else
            "discard"; empty for a program.
          type: string
        source:
          description: |-
            Source is its file as written: an LLM routine's frontmatter and
            prompt, a program's description file.
          type: string
        staleness:
          type: string
        timeout:
          type: string
        tools:
          items:
            type: string
          type: array
        trusted:
          description: |-
            Trusted is whether it may run for real (what it can reach is what I
            trusted); Untrusted says why not.
          type: boolean
        turnOn:
          description: |-
            TurnOn is true while turning it on (`routines trust <name> --yes
            --resume`) has something to do: it isn't trusted, or it's paused with
            a schedule. Frontends offer Turn On… while it is.
          type: boolean
        untrusted:
          type: string
      required:
