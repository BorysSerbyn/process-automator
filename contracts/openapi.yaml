        builtinTools:
          items:
            type: string
          type: array
        description:
          type: string
        enabled:
          type: boolean
        folder:
          description: 'Folder is where its runs work (absent: a temporary folder).'
          type: string
        kind:
          description: Kind is program for a program hook; absent for an LLM hook (llm).
          enum:
