        notifications:
          description: Notifications is the app's own notifications file.
          type: string
        programs:
          description: 'Programs is the programs folder: the app''s copies of the programs added.'
          type: string
        routines:
          type: string
        runStatus:
          type: string
        templates:
          description: Templates is where the app's templates are (empty if unknown).
          type: string
        watchers:
          type: string
      required:
        - config
        - data
        - routines
        - runStatus
        - history
        - notifications
        - mcpChanges
        - frontendLog
      type: object
    PermissionNeed:
      additionalProperties: false
      description: PermissionNeed is a permission something needs, what declares it, and what the scheduler last found.
      properties:
        by:
          items:
            $ref: '#/components/schemas/PermissionSource'
          type: array
        label:
          description: Label is what the OS calls it (Input Monitoring).
          type: string
        permission:
          type: string
        settingsUrl:
          type: string
        state:
          description: |-
            State is what the scheduler last found: granted, missing, unknown (it
            can't be checked), unsupported (not on this OS) or not-checked
            (nothing recorded yet). Only missing and not-checked keep it from
            running.
          enum:
            - granted
            - missing
            - unknown
            - unsupported
            - not-checked
          type: string
        where:
          description: |-
            Where says where it's turned on, following "turn it on" ("in System
            Settings > Privacy & Security > Input Monitoring"), and SettingsURL is
            the address that opens it (absent where there's none).
          type: string
      required:
        - permission
        - label
        - state
        - by
      type: object
    PermissionReport:
      additionalProperties: false
      description: PermissionReport is what's needed, by what, and what the scheduler last found (`permissions list`).
      properties:
        checkedAt:
          description: |-
            CheckedAt is when the scheduler last checked (absent: never, so every
            state is not-checked).
          format: date-time
          type: string
        permissions:
          items:
            $ref: '#/components/schemas/PermissionStatus'
          type: array
      required:
        - permissions
      type: object
    PermissionRequest:
      additionalProperties: false
      description: PermissionRequest is how asking the OS for a permission went (`permissions request`).
      properties:
        asked:
          description: |-
            Asked is whether the scheduler asked the OS (the first time, macOS
            shows its prompt naming the app; after that only its settings change
            it); Why says why not.
          type: boolean
        by:
          items:
            $ref: '#/components/schemas/PermissionSource'
          type: array
        label:
          description: Label is what the OS calls it (Input Monitoring).
          type: string
        permission:
          type: string
        settingsUrl:
          type: string
        state:
          description: |-
            State is what the scheduler last found: granted, missing, unknown (it
            can't be checked), unsupported (not on this OS) or not-checked
            (nothing recorded yet). Only missing and not-checked keep it from
            running.
          enum:
            - granted
            - missing
            - unknown
            - unsupported
            - not-checked
          type: string
        where:
          description: |-
            Where says where it's turned on, following "turn it on" ("in System
            Settings > Privacy & Security > Input Monitoring"), and SettingsURL is
            the address that opens it (absent where there's none).
          type: string
        why:
          type: string
      required:
        - permission
        - label
        - state
        - by
        - asked
      type: object
    PermissionSource:
      additionalProperties: false
      description: 'PermissionSource is what declares a permission something needs: a plugin it uses, its own program (a program''s, a program hook''s) or its watcher.'
      properties:
        kind:
          enum:
            - plugin
            - program
            - hook
            - watcher
          type: string
        name:
          type: string
      required:
        - kind
        - name
      type: object
    PermissionStatus:
      additionalProperties: false
      description: 'PermissionStatus is a permission, what the scheduler last found, and everything that needs it (By: what declares it for any of them).'
      properties:
        by:
          items:
            $ref: '#/components/schemas/PermissionSource'
          type: array
        label:
          description: Label is what the OS calls it (Input Monitoring).
          type: string
        neededBy:
          items:
            $ref: '#/components/schemas/PermissionUse'
          type: array
        permission:
          type: string
        settingsUrl:
          type: string
        state:
          description: |-
            State is what the scheduler last found: granted, missing, unknown (it
            can't be checked), unsupported (not on this OS) or not-checked
            (nothing recorded yet). Only missing and not-checked keep it from
            running.
          enum:
            - granted
            - missing
            - unknown
            - unsupported
            - not-checked
          type: string
        where:
          description: |-
            Where says where it's turned on, following "turn it on" ("in System
            Settings > Privacy & Security > Input Monitoring"), and SettingsURL is
            the address that opens it (absent where there's none).
          type: string
      required:
        - permission
        - label
        - state
        - by
        - neededBy
      type: object
    PermissionUse:
      additionalProperties: false
      description: 'PermissionUse is something that needs a permission: a routine (LLM), a program, a hook or a watcher.'
      properties:
        by:
          description: By is what declares the permission for it.
          items:
            $ref: '#/components/schemas/PermissionSource'
          type: array
        enabled:
          description: |-
            Enabled is whether it's on: a routine or a hook enabled, a watcher not
            paused.
          type: boolean
        kind:
          enum:
            - routine
            - program
            - hook
            - watcher
          type: string
        name:
          type: string
      required:
        - kind
        - name
        - enabled
        - by
      type: object
    Picker:
      additionalProperties: false
      description: Picker is a schedule as days of the week and a time of day.
      properties:
        at:
          description: At is the time, HH:MM (24-hour).
          type: string
        days:
          description: 'Days the routine runs, from Days (all seven: every day).'
          items:
            enum:
              - sun
              - mon
              - tue
              - wed
              - thu
              - fri
              - sat
            type: string
          type: array
      required:
        - days
        - at
      type: object
    PluginChange:
      additionalProperties: false
      description: PluginChange is the output of `plugins add/remove --json`.
      properties:
        accountOf:
          description: |-
            AccountOf is, for an account added or removed, the plugin it's an
            account of.
          type: string
        endpoint:
          type: string
        kind:
          description: Kind and Endpoint describe the server after the change (absent when removed).
          type: string
        plugin:
          type: string
        signIn:
          description: SignIn is the command that signs in to it, when it needs credentials.
          type: string
        trial:
          $ref: '#/components/schemas/PluginTrial'
          description: Trial is what trying it found (adds only).
      required:
        - plugin
      type: object
    PluginCheck:
      additionalProperties: false
      description: PluginCheck is one row of `plugins check --json`.
      properties:
        needsSignIn:
          description: |-
            NeedsSignIn means it couldn't be tried further without credentials
            (`auth login <name>`, then `plugins check <name>`).
          type: boolean
        ok:
          type: boolean
        plugin:
          type: string
        problem:
          description: Problem is why routines couldn't use it (doesn't start, not signed in, bad tools).
          type: string
        tools:
          items:
            $ref: '#/components/schemas/PluginTool'
          type: array
        warnings:
          items:
            type: string
          type: array
      required:
        - plugin
        - ok
      type: object
    PluginInfo:
      additionalProperties: false
      description: PluginInfo is one row of `plugins list --json`.
      properties:
        accountOf:
          description: |-
            AccountOf is, for an account (a second sign-in of a plugin under a
            name of its own), the plugin it's an account of.
          type: string
        description:
          type: string
        endpoint:
          description: URL or command, for external plugins
          type: string
        kind:
          description: in-process, remote, local
          type: string
        name:
          type: string
        permissions:
          description: |-
            Permissions are what the OS must allow it before its tools can work,
