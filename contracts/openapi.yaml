    RunOutput:
      additionalProperties: false
      description: 'RunOutput is `run --json`: how the run went.'
      properties:
        backend:
          type: string
        cachedTokens:
          type: integer
        calls:
          description: |-
            Calls are every tool call, in order (absent in records from before
            they were kept).
          items:
            $ref: '#/components/schemas/Call'
          type: array
        costUsd:
          description: |-
            CostUSD is the run's cost at API list prices: claude-api runs only (agent CLI
            runs are on the CLI's own plan, and the app never works out a cost for them).
          type: number
        dryRun:
          type: boolean
        inputTokens:
          type: integer
        kind:
          description: Kind is program for a program; absent for an LLM routine (llm).
          enum:
            - llm
            - program
          type: string
        outcome:
          description: |-
            Outcome is the routine's own report when the run succeeded: done or
            nothing_to_do (a failed report fails the run). Reason says why.
          type: string
        output:
          description: |-
            Output is the result in the shape the routine declared (Dotprompt
            output: schema), validated; absent for routines without one.
        outputTokens:
          type: integer
        program:
          $ref: '#/components/schemas/Execution'
          description: 'Program is a program''s run: its exit code, summary and output.'
        promptSource:
          description: the routine file
          type: string
        reason:
          type: string
        text:
          type: string
        toolCalls:
          type: integer
        writes:
          items:
            $ref: '#/components/schemas/Write'
          type: array
      type: object
    RunStatus:
      additionalProperties: false
      description: Status is the whole record.
      properties:
        busy:
          description: |-
            Busy is true while a routine is running (not counting runs stuck past
            MaxRunDuration); frontends show activity from it.
          type: boolean
        health:
          enum:
            - ok
            - error
            - none
          type: string
        hooks:
          description: |-
            Hooks are the hooks, as routines are: each with its last run, its
            health and summary. A hook is never among Routines.
          items:
            $ref: '#/components/schemas/RunStatusRoutine'
          type: array
        problem:
          description: |-
            Problem says why the scheduler can't work right now (e.g. the config
            file doesn't load); set and cleared by the scheduler on every check.
          type: string
        reasons:
          description: |-
            Reasons say why health is error, in words, for frontends to show as
            they are; empty when it isn't. They come from the same rules as health.
          items:
            $ref: '#/components/schemas/RunStatusReason'
          type: array
        routines:
          items:
            $ref: '#/components/schemas/RunStatusRoutine'
          type: array
        schemaVersion:
          type: integer
        setupLeft:
          description: |-
            SetupLeft names the setup steps still to do (`setup --json`'s titles;
            empty when setup is done). Unfinished setup makes health error.
          items:
            type: string
          type: array
        summary:
          description: |-
            Summary is the state in a few words ("All good", "No routines
            enabled"), for frontends to show when there are no reasons.
          type: string
        updatedAt:
          format: date-time
          type: string
        validUntil:
          description: |-
            ValidUntil is the scheduler's heartbeat: the status holds until then.
            Past it (or absent), the core isn't responding.
          format: date-time
          type: string
      required:
        - schemaVersion
        - updatedAt
        - health
        - busy
        - routines
      type: object
    RunStatusReason:
      additionalProperties: false
      description: Reason is one thing making health error.
      properties:
        detail:
          type: string
        hook:
          description: Hook is true when Routine names a hook, not a routine.
          type: boolean
        routine:
          description: Routine it's about; empty for the scheduler itself.
          type: string
        run:
          description: Run is the run it's about (a history ID, as `runs show` takes), if any.
          type: string
        text:
          description: |-
            Text is a short headline ("standup failed"); Detail the full story (the
            run's reason), for frontends to show on demand.
          type: string
        watcher:
          description: |-
            Watcher is the watcher it's about, when what's wrong is a watcher's
            (failing, untrusted, paused, a permission it needs): one reason for
            it, naming the hooks that listen to it, and Routine is empty.
          type: string
      required:
        - text
      type: object
    RunStatusRoutine:
      additionalProperties: false
      description: Routine is one routine's entry.
      properties:
        enabled:
          type: boolean
        health:
          description: |-
            Health is the routine's own verdict: error when it makes the app's
            health error, ok while it's enabled and fine, none while it's paused
            or, after a health reset, until it runs again.
          type: string
        healthResetAt:
          description: |-
            HealthResetAt is when the scheduler last found that a permission it
            needs changed (its state, or which ones it needs): a run that started
            before then no longer counts toward its health, which is none until it
            runs again. Its runs stay in history as they were.
          format: date-time
          type: string
        lastRun:
          $ref: '#/components/schemas/RunStatusRun'
        name:
          type: string
        nextRunAt:
          description: |-
            NextRunAt is the next slot the scheduler will handle (enabled, scheduled
            routines only). The scheduler moves it forward as soon as it picks a slot
            up, so one more than SchedulerGrace in the past means it didn't.
          format: date-time
          type: string
        problem:
          description: |-
            Problem says why the routine can't be scheduled (e.g. its file doesn't
            parse). It's current state, cleared as soon as the routine is fixed. A
            hook's ends with what's wrong with its watcher, when something is:
            "its watcher " and WatcherProblem.
          type: string
        summary:
          description: |-
            Summary is its state in a few words ("Next: tomorrow 09:20", "standup
            failed", "Paused"), for frontends to show as is.
          type: string
        watcher:
          description: |-
            Watcher is the watcher a hook listens to, and WatcherProblem what's
            wrong with it that keeps the hook from hearing its events (failing,
            untrusted, paused, a permission it needs), said about the watcher
            ("keys is failing: …"): the same for every hook on it, so it's one
            reason, about the watcher, not one per hook.
          type: string
        watcherProblem:
          type: string
      required:
        - name
        - enabled
      type: object
    RunStatusRun:
      additionalProperties: false
      description: Run is the most recent run of a routine.
      properties:
        backend:
          description: |-
            Backend is the model backend running it, or that ran it (llm.backend's
            value), once it got as far as the model.
          type: string
        deadline:
          description: Deadline is when a running run is stopped (its routine's timeout).
          format: date-time
          type: string
        finishedAt:
          format: date-time
          type: string
        folder:
          description: |-
            Folder is the folder the run worked in (where its session resumes
            from), unless it was an empty temporary one.
          type: string
        for:
          description: For is the time the run is for (the schedule slot, the backfilled day).
          format: date-time
          type: string
        id:
          description: ID is the run's history ID (as `runs show` takes).
          type: string
        outcome:
          enum:
            - success
            - failed
            - skipped
            - missed
            - needs-reauth
            - running
            - queued
            - stopped
          type: string
        queuedAt:
          description: QueuedAt is when the run started waiting for its turn, if it had to.
          format: date-time
          type: string
        reason:
          type: string
        sessionId:
          description: |-
            SessionID is the run's saved agent CLI session (routines with
            session: save): set when the run starts if the app picks its ID, when
            it ends if the CLI does (Backend says which CLI resumes it).
          type: string
        startedAt:
          format: date-time
          type: string
        trigger:
          description: |-
            Trigger is what started the run: "schedule", "manual", "backfill" or
            (a hook's) "event" (empty in records from before triggers were
            recorded).
          type: string
      required:
        - startedAt
        - outcome
      type: object
    RunningOutput:
      additionalProperties: false
      description: 'RunningOutput is `login-items start --json` and `login-items stop --json`: whether the scheduler runs now, and what the command changed.'
      properties:
        changed:
          description: |-
            Changed is whether the command started or stopped it (false: it
            already was).
          type: boolean
        scheduler:
          description: Scheduler is running or stopped, as the command left it.
          enum:
            - running
            - stopped
          type: string
        uiStopped:
          description: |-
            UIStopped is whether stop stopped a running menu bar app or tray
            (besides the one that ran it, if one did).
          type: boolean
      required:
        - scheduler
        - changed
      type: object
    SetupOutput:
      additionalProperties: false
      description: 'SetupOutput is `setup --json`: every step, in order of kind (templates, backend, plan usage, Claude Code''s MCP connection, routines to fix, sign-ins, routines to turn on).'
      properties:
        done:
          description: |-
            Done is true when every step that isn't optional is; Remaining counts
            those that aren't.
          type: boolean
        remaining:
          type: integer
        steps:
          items:
            $ref: '#/components/schemas/SetupStep'
          type: array
      required:
        - steps
        - done
        - remaining
      type: object
    SetupStep:
      additionalProperties: false
      description: SetupStep is one thing first-run setup covers.
      properties:
        ask:
          type: string
        auto:
          description: |-
            Auto steps are done without asking: the interactive setup and
            frontends run its commands as soon as they come to it (connecting
            Claude Code to the app's MCP server). Ask is empty.
          type: boolean
        commands:
          description: |-
            Commands do the step once I've answered: placeholders in <angle
            brackets> are my answers, and a trailing # comment says when a command
            applies or what to do with its output.
          items:
            type: string
          type: array
        done:
          type: boolean
        optional:
          description: |-
            Optional steps don't keep setup from being done: installing templates,
            and resuming a trusted routine once another routine already runs on its
            schedule (a paused one may be paused on purpose).
          type: boolean
        prepare:
          description: |-
            Prepare is what to do outside the app before signing in (a sign-in
            step whose plugin needs it, e.g. creating a Slack app): numbered steps
            to show, and have done, first. `auth login` shows them too.
          type: string
        setting:
          description: |-
            Setting is the setting the step chooses, for frontends to show and set
            (backend: llm.backend).
          type: string
        settings:
          description: |-
            Settings are further settings the step needs set, for frontends to show
            and set with each setting's own control (backend: the local backend's
            server and model).
          items:
            type: string
          type: array
        signIn:
          description: |-
            SignIn is what the step still needs signed in (`auth login <signIn>
            --browser`): a server, or the API key the claude-api backend needs.
          type: string
        status:
          description: |-
            Status says where it stands, and Ask what to ask me before doing it, in
            words for me.
          type: string
        step:
          description: Step is what it sets up.
          enum:
            - templates
            - backend
            - routine
            - sign-in
            - turn-on
            - usage
            - mcp
          type: string
        subject:
          description: Subject is the server or routine it's about (routine, sign-in, turn-on).
          type: string
        title:
          description: Title names the step ("Model backend", "Sign in to tracker").
          type: string
      required:
        - step
        - title
        - done
        - status
      type: object
    StartOutput:
      additionalProperties: false
      description: 'StartOutput is `start --json`: a run started in the background.'
      properties:
        dryRun:
          type: boolean
        log:
          description: |-
            Log is where the run's output goes; its outcome is in run status and
            the run history, as for any run.
          type: string
        routine:
          type: string
      required:
        - routine
        - dryRun
        - log
      type: object
    State:
      additionalProperties: false
      description: State is a setting with its effective value.
      properties:
        alsoBackend:
          description: |-
            AlsoBackend is another llm.backend it applies to, for some routines
            (llm.local.url: claude-api's local/<model> routines).
          type: string
        backend:
          description: 'Backend is the llm.backend it applies to; empty: every backend.'
          type: string
        default: {}
        defaultText:
          type: string
        description:
          type: string
        enum:
          items:
            type: string
          type: array
        enumHelp:
          additionalProperties:
            type: string
          description: |-
            EnumHelp says in a line what each enum value means, for choosing one:
            setup lists them, the Settings window shows the selected one's.
          type: object
        inactive:
          description: |-
            Inactive says why the setting has no effect now: it's for another
            llm.backend than the one in use.
          type: string
        isDefault:
          type: boolean
        key:
          type: string
        max:
          type: number
        min:
          type: number
        notImplemented:
          description: |-
            NotImplemented marks a setting declared ahead of the feature that uses it:
            it can be set, but has no effect yet.
          type: boolean
        type:
          enum:
            - bool
            - int
            - number
            - percent
            - duration
            - cron
            - enum
            - string
            - path
            - list
          type: string
        unit:
          type: string
        value: {}
        valueText:
          description: |-
            ValueText and DefaultText are the values written the way `settings set`
            takes them ("" when unset), for frontends to show and send back as is.
          type: string
      required:
        - key
        - type
        - default
        - description
        - value
        - isDefault
        - valueText
        - defaultText
      type: object
    StatusLineOutput:
      additionalProperties: false
      description: StatusLineOutput is `usage statusline install|uninstall --json`.
      properties:
        installed:
          description: Installed is whether Claude Code's status line runs the app's command.
          type: boolean
        wraps:
          description: 'Wraps is the status line command of mine the app runs (empty: none).'
          type: string
      required:
        - installed
      type: object
    StopOutput:
      additionalProperties: false
      description: 'StopOutput is `stop --json`: how the stopped run ended.'
      properties:
        outcome:
          type: string
        reason:
          type: string
        routine:
          type: string
      required:
        - routine
        - outcome
      type: object
    Summary:
      additionalProperties: false
      description: Summary is an entry without the agent result, for listings.
      properties:
        backend:
          description: Backend is what ran it (an llm.backend value), when it got as far as the model.
          type: string
        costUsd:
          description: |-
            CostUSD is the run's cost at API list prices: claude-api runs only (a Claude
            plan's runs have no cost).
          type: number
        finishedAt:
          format: date-time
          type: string
        folder:
          type: string
        for:
          format: date-time
          type: string
        hook:
          description: Hook is true for a hook's run.
          type: boolean
        id:
          type: string
        kind:
          description: |-
            Kind is the routine's kind: program for a program; absent for an LLM
            routine (llm).
          enum:
            - llm
            - program
          type: string
        outcome:
          type: string
        reason:
          type: string
        routine:
          type: string
        sessionId:
          type: string
        startedAt:
          format: date-time
          type: string
        toolCalls:
          type: integer
        trigger:
          type: string
      required:
        - id
        - routine
        - trigger
        - startedAt
        - outcome
      type: object
    Surface:
      additionalProperties: false
      description: Surface is what a routine can reach.
      properties:
        builtinTools:
          items:
            type: string
          type: array
        folder:
          type: string
        plugins:
          type: object
        servers:
          items:
            type: string
          type: array
        tools:
          items:
            type: string
          type: array
      required:
        - servers
        - tools
      type: object
    TemplateInfo:
      additionalProperties: false
      description: TemplateInfo is one row of `templates list --json`.
      properties:
        backends:
          description: 'Backends it works with (llm.backend values); none: any.'
          items:
            type: string
          type: array
        description:
          type: string
        id:
          description: ID is its tag path and name, e.g. "projects/acme/standup".
          type: string
        installed:
          description: Installed is true when a routine with the template's name exists.
          type: boolean
        name:
          type: string
        params:
          items:
            $ref: '#/components/schemas/Param'
          type: array
        platforms:
          items:
            type: string
          type: array
        project:
          description: |-
            Project is the project it's for (its folder under projects/, e.g.
            "acme"); empty for every project or none.
          type: string
        runsHere:
          description: RunsHere is false for templates for another OS (listed with --all).
          type: boolean
        supportsBackend:
          description: |-
            SupportsBackend is false for a template that doesn't work with the
            selected backend (llm.backend): installing it is refused.
          type: boolean
        tags:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - tags
        - runsHere
        - supportsBackend
        - installed
      type: object
    ToolInfo:
      additionalProperties: false
      description: ToolInfo is one row of `mcp tools --json`.
      properties:
        description:
          type: string
        inputSchema: {}
        name:
          type: string
        readOnly:
          description: ReadOnly is the server's readOnlyHint annotation (nil when not declared).
          type: boolean
      required:
        - name
        - description
      type: object
    Trigger:
      additionalProperties: false
      description: 'Trigger is what a hook was trusted to act on: a watcher''s events, of one type (empty: every type), one at a time or in batches.'
      properties:
        batch:
          type: boolean
        type:
          type: string
        watcher:
          type: string
      required:
        - watcher
      type: object
    TrustOutput:
      additionalProperties: false
      description: TrustOutput is `routines trust --json`.
      properties:
        changes:
          description: Changes since it was last trusted (empty for a first trust).
          items:
            type: string
          type: array
        hook:
          description: |-
            Hook is true for a hook: Kind is its action's, and Trigger is what it
            acts on, which trusting it covers too.
          type: boolean
        kind:
          description: Kind is program for a program; absent for an LLM routine (llm).
          enum:
            - llm
            - program
          type: string
        "on":
          $ref: '#/components/schemas/On'
          description: |-
            On is a hook's trigger as `hooks list` gives it: with its type's
            label, as its watcher declares it.
        permissions:
          description: |-
            Permissions are what the OS must allow it before it works: an LLM
            routine's plugins', a program's own, a hook's action's and its
            watcher's, each with what declares it and what the scheduler last
            found (`permissions request <permission>` asks for one). Trusting
            covers them (one added later needs a new review) and doesn't wait for
            them; while one isn't granted it doesn't run.
          items:
            $ref: '#/components/schemas/PermissionNeed'
          type: array
        program:
          $ref: '#/components/schemas/ProgramInfo'
          description: |-
            Program is what trusting a program approves: the executable that
            runs (by checksum, with its description file), what it declares.
        resumed:
          description: |-
            Resumed is true when --resume turned its schedule on (it was paused),
            or turned a hook on.
          type: boolean
        routine:
          type: string
        signIns:
          description: |-
            SignIns are the sign-ins it still needs before it works (`auth login
            <name>`): its servers', its own secrets' (a program's, a hook's), and
            its watcher's. Trusting doesn't wait for them.
          items:
            type: string
          type: array
        surface:
          $ref: '#/components/schemas/Surface'
        tools:
          description: |-
            Tools are its allowlisted tools with the server offering each and
            whether it's read-only (absent when its servers couldn't be reached).
          items:
            $ref: '#/components/schemas/CheckedTool'
          type: array
        toolsError:
          description: |-
            ToolsError says why its tools couldn't be checked (e.g. a server needs
            a sign-in).
          type: string
        trigger:
          $ref: '#/components/schemas/Trigger'
        trusted:
          type: boolean
        warnings:
          description: |-
            Warnings are what to weigh before trusting it: an LLM hook with
            write tools acts on outside event data.
          items:
            type: string
          type: array
        watcher:
          $ref: '#/components/schemas/WatcherTrust'
          description: |-
            Watcher is the hook's watcher: trusting the hook (--yes) trusts it
            too when it isn't trusted, so its review is part of the hook's.
      required:
        - routine
        - surface
        - changes
        - trusted
      type: object
    UpdateOutput:
      additionalProperties: false
      description: UpdateOutput is `update --json`.
      properties:
        current:
          type: string
        inProgress:
          description: |-
            InProgress is true while an update is installing (this one, or one
            started before).
          type: boolean
        latest:
          description: Latest is the newest release tag, empty when there are none.
          type: string
        note:
          description: |-
            Note says what installing involves, for frontends to show before they
            start one (set when an update is available).
          type: string
        started:
          description: Started is true when --detach started the update in the background.
          type: boolean
        updateAvailable:
          type: boolean
        updated:
          type: boolean
      required:
        - current
        - latest
        - updateAvailable
        - updated
        - inProgress
      type: object
    UpdateProgress:
      additionalProperties: false
      description: 'UpdateProgress is `update progress --json`: the latest update, as it goes.'
      properties:
        detail:
          description: Detail is the latest line of the step's output (a build's), if any.
          type: string
        error:
          description: Error is why it failed.
          type: string
        finishedAt:
          format: date-time
          type: string
        log:
          description: Log is the file a detached update writes its whole output to.
          type: string
        startedAt:
          format: date-time
          type: string
        state:
          description: State is none (no update has run), installing, done or failed.
          enum:
            - none
            - installing
            - done
            - failed
          type: string
        step:
          description: Step is what it's doing (or last did), in words.
          type: string
        tag:
          description: Tag is the release being installed, once known.
          type: string
      required:
        - state
        - log
      type: object
    VersionOutput:
      additionalProperties: false
      description: VersionOutput is `version --json`.
      properties:
        version:
          type: string
      required:
        - version
      type: object
    WatcherChange:
      additionalProperties: false
      description: WatcherChange is the output of `watchers add/update/delete/pause/resume --json`.
      properties:
        enabled:
          description: Enabled is whether it may run after the change (absent for deletes).
          type: boolean
        path:
          type: string
        watcher:
          type: string
      required:
        - watcher
        - path
      type: object
    WatcherDetail:
      additionalProperties: false
      description: 'WatcherDetail is `watchers show --json`: a watcher with its description file''s source.'
      properties:
        args:
          items:
            type: string
          type: array
        checksum:
          type: string
        description:
          type: string
        enabled:
          description: Enabled is false while it's paused.
          type: boolean
        error:
          description: |-
            Error is why its last poll failed or its stream last ended early
            (cleared once it works again, or a permission it needs changes), and
            ErrorAt when.
          type: string
        errorAt:
          format: date-time
          type: string
        events:
          description: |-
            Events are the events it declares it prints, in its file's order,
            each with its label and the hooks that act on it. Absent when it
            declares none: it may print any type (Hint says so).
          items:
            $ref: '#/components/schemas/WatcherEvent'
          type: array
        executable:
          description: |-
            Executable is the app's copy, the one that runs; Checksum its SHA-256
            (trust is keyed to it).
          type: string
        hint:
          description: |-
            Hint is a nudge about how it's written that doesn't keep it from
            running (it doesn't declare its events): never a problem.
          type: string
        hooks:
          description: |-
            Hooks are the hooks that listen to it; it runs while one of them is
            on (and it's trusted and not paused).
          items:
            type: string
          type: array
        interval:
          description: |-
            Interval and Timeout are a poll watcher's: how often it runs, and how
            long one poll may take.
          type: string
        lastEventAt:
          format: date-time
          type: string
        lastPollAt:
          description: |-
            LastPollAt is when a poll last worked; StartedAt when its stream last
            started; LastEventAt when it last printed a new event.
          format: date-time
          type: string
        mode:
          description: Mode is poll (run every interval) or stream (one long-lived process).
          enum:
            - poll
            - stream
          type: string
        name:
          type: string
        path:
          type: string
        permissions:
          description: |-
            Permissions are what the OS must allow it, as its file declares, with
            what the scheduler last found: it isn't started while one isn't
            granted. Absent when none.
          items:
            $ref: '#/components/schemas/PermissionNeed'
          type: array
        secrets:
          items:
            $ref: '#/components/schemas/ProgramSecret'
          type: array
        source:
          type: string
        startedAt:
          format: date-time
          type: string
        timeout:
          type: string
        trusted:
          type: boolean
        untrusted:
          type: string
      required:
        - name
        - path
        - mode
        - executable
        - args
        - secrets
        - enabled
        - trusted
        - hooks
        - source
      type: object
    WatcherEvent:
      additionalProperties: false
      description: WatcherEvent is an event a watcher declares, with the hooks that act on it.
      properties:
        hooks:
          description: |-
            Hooks are the hooks that act on it: those listening for its type, and
            those listening for every type.
          items:
            type: string
          type: array
        label:
          description: Label is what it means, in words ("End key pressed").
          type: string
        type:
          type: string
      required:
        - type
        - label
        - hooks
      type: object
    WatcherInfo:
      additionalProperties: false
      description: WatcherInfo is one row of `watchers list --json`.
      properties:
        args:
          items:
            type: string
          type: array
        checksum:
          type: string
        description:
          type: string
        enabled:
          description: Enabled is false while it's paused.
          type: boolean
        error:
          description: |-
            Error is why its last poll failed or its stream last ended early
            (cleared once it works again, or a permission it needs changes), and
            ErrorAt when.
          type: string
        errorAt:
          format: date-time
          type: string
        events:
          description: |-
            Events are the events it declares it prints, in its file's order,
            each with its label and the hooks that act on it. Absent when it
            declares none: it may print any type (Hint says so).
          items:
            $ref: '#/components/schemas/WatcherEvent'
          type: array
        executable:
          description: |-
            Executable is the app's copy, the one that runs; Checksum its SHA-256
            (trust is keyed to it).
          type: string
        hint:
          description: |-
            Hint is a nudge about how it's written that doesn't keep it from
            running (it doesn't declare its events): never a problem.
          type: string
        hooks:
          description: |-
            Hooks are the hooks that listen to it; it runs while one of them is
            on (and it's trusted and not paused).
          items:
            type: string
          type: array
        interval:
          description: |-
            Interval and Timeout are a poll watcher's: how often it runs, and how
            long one poll may take.
          type: string
        lastEventAt:
          format: date-time
          type: string
        lastPollAt:
          description: |-
            LastPollAt is when a poll last worked; StartedAt when its stream last
            started; LastEventAt when it last printed a new event.
          format: date-time
          type: string
        mode:
          description: Mode is poll (run every interval) or stream (one long-lived process).
          enum:
            - poll
            - stream
          type: string
        name:
          type: string
        path:
          type: string
        permissions:
          description: |-
            Permissions are what the OS must allow it, as its file declares, with
            what the scheduler last found: it isn't started while one isn't
            granted. Absent when none.
          items:
            $ref: '#/components/schemas/PermissionNeed'
          type: array
        secrets:
          items:
            $ref: '#/components/schemas/ProgramSecret'
          type: array
        startedAt:
          format: date-time
          type: string
        timeout:
          type: string
        trusted:
          type: boolean
        untrusted:
          type: string
      required:
        - name
        - path
        - mode
        - executable
        - args
        - secrets
        - enabled
        - trusted
        - hooks
      type: object
    WatcherTrust:
      additionalProperties: false
      description: 'WatcherTrust is a hook''s watcher in the hook''s review: whether it''s trusted, and what trusting it approves.'
      properties:
        changes:
          description: Changes since it was last trusted (empty for a first trust).
          items:
            type: string
          type: array
        description:
          description: |-
            Description, Mode and Program are what it is and runs (absent when
            there's no such watcher): its executable by checksum, its arguments
            and secrets, each stored or not.
          type: string
        events:
          description: |-
            Events are the events it declares it prints, which trusting it
            covers (absent: it declares none, and may print any type).
          items:
            $ref: '#/components/schemas/WatcherEvent'
          type: array
        mode:
          enum:
            - poll
            - stream
          type: string
        name:
          type: string
        program:
          $ref: '#/components/schemas/ProgramInfo'
        trusted:
          type: boolean
        untrusted:
          description: Untrusted says why not (no such watcher, not trusted yet, changed).
          type: string
      required:
        - name
        - trusted
      type: object
    WatcherTrustOutput:
      additionalProperties: false
      description: WatcherTrustOutput is `watchers trust --json`.
      properties:
        changes:
          description: Changes since it was last trusted (empty for a first trust).
          items:
            type: string
          type: array
        events:
          description: |-
            Events are the events it declares it prints, which trusting it
            covers (absent: it declares none).
          items:
            $ref: '#/components/schemas/WatcherEvent'
          type: array
        mode:
          enum:
            - poll
            - stream
          type: string
        permissions:
          description: |-
            Permissions are what the OS must allow it, which trusting it covers,
            with what the scheduler last found (absent when none).
          items:
            $ref: '#/components/schemas/PermissionNeed'
          type: array
        program:
          $ref: '#/components/schemas/ProgramInfo'
          description: |-
            Program is what trusting it approves: the executable that runs (by
            checksum, with its description file), its arguments and secrets.
        trusted:
          type: boolean
        watcher:
          type: string
      required:
        - watcher
        - program
        - mode
        - changes
        - trusted
      type: object
    Window:
      additionalProperties: false
      description: Window is usage in one window.
      properties:
        budgetUsd:
          type: number
        length:
          description: Length is the window's length ("5h", "7d").
          type: string
        name:
          description: Name is "session" or "weekly" (plan), "window" or "week" (budget).
          type: string
        over:
          type: boolean
        resetsAt:
          format: date-time
          type: string
        spentUsd:
          description: |-
            SpentUSD is what runs spent in it, and BudgetUSD its budget (budget;
            a budget of 0 is none).
          type: number
        usedPercent:
          description: |-
            UsedPercent is how much of the plan's limit is used, and ResetsAt when
            it resets (plan; absent: not known).
          type: number
      required:
        - name
        - length
        - over
      type: object
    Write:
      additionalProperties: false
      description: Write is a side-effecting tool call (intercepted in dry-run).
      properties:
        args:
          type: object
        error:
          description: Error is the tool's error, when the call failed.
          type: string
        tool:
          type: string
      required:
        - tool
        - args
      type: object
