        builtinTools:
          items:
            type: string
          type: array
        description:
          type: string
        enabled:
          type: boolean
        folder:
          description: 'Folder is where its runs work (absent: a temporary folder).'
          type: string
        kind:
          description: Kind is program for a program hook; absent for an LLM hook (llm).
          enum:
            - llm
            - program
          type: string
        lastRun:
          $ref: '#/components/schemas/RunStatusRun'
          description: LastRun is its latest outcome from run status.
        model:
          type: string
        name:
          type: string
        "on":
          $ref: '#/components/schemas/On'
          description: |-
            On is what it acts on: a watcher's events, of one type (or every
            type), with the type's label as its watcher declares it.
        path:
          description: |-
            Path is its file: its prompt, or its program's description file (in
