version: "2"
linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      exclude-functions:
        # CLI output and best-effort cleanup: failures here are not actionable.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net.Listener).Close
        - (*net/http.Server).Close
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ClientSession).Close
formatters:
  enable:
    - gofmt
    - goimports
